name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish SAT Messenger Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read app version metadata
        id: app_meta
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/.*=\s*([0-9]+).*/\1/')
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Detected SAT Messenger v${VERSION_NAME} (versionCode ${VERSION_CODE})"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare Firebase google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > /tmp/gs_raw
            if grep -q '"project_info"' /tmp/gs_raw; then
              cp /tmp/gs_raw app/google-services.json
            else
              base64 -d /tmp/gs_raw > app/google-services.json
            fi
            rm -f /tmp/gs_raw
          fi
          if [ ! -f app/google-services.json ]; then
            echo "::error::Missing app/google-services.json. Commit app/google-services.json or add a repository secret named GOOGLE_SERVICES_JSON in GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Prepare debug signing keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: bash scripts/ensure-debug-keystore.sh

      - name: Build Debug APK (Universal Sideload)
        run: gradle :app:assembleDebug

      - name: Build Signed Release APK & AAB (if release secrets configured)
        id: release_build
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            chmod 600 my-upload-key.jks
            export KEYSTORE_PATH="${PWD}/my-upload-key.jks"
            gradle :app:assembleRelease :app:bundleRelease
            echo "has_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::RELEASE_KEYSTORE_BASE64 / STORE_PASSWORD / KEY_PASSWORD secrets are not set. Publishing Debug APK only; add those secrets to also publish signed Release APK & AAB packages."
            echo "has_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage versioned & stable distribution files + SHA-256 checksums
        run: |
          VERSION="${{ steps.app_meta.outputs.version_name }}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/sat-messenger-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "dist/sat-messenger-v${VERSION}-debug.apk"

          if [ "${{ steps.release_build.outputs.has_release }}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/sat-messenger-release.apk
            cp app/build/outputs/apk/release/app-release.apk "dist/sat-messenger-v${VERSION}-release.apk"
            cp app/build/outputs/bundle/release/app-release.aab dist/sat-messenger-release.aab
            cp app/build/outputs/bundle/release/app-release.aab "dist/sat-messenger-v${VERSION}-release.aab"
          fi

          (cd dist && shopt -s nullglob && sha256sum *.apk *.aab > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Clean up temporary release keystore
        if: always()
        run: rm -f my-upload-key.jks

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sat-messenger-v${{ steps.app_meta.outputs.version_name }}-packages
          path: dist/*

      - name: Publish GitHub Release with Downloadable Packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.app_meta.outputs.version_name) }}
          name: SAT Messenger v${{ steps.app_meta.outputs.version_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/*
