name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build SAT Messenger APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare Firebase google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > /tmp/gs_raw
            if grep -q '"project_info"' /tmp/gs_raw; then
              cp /tmp/gs_raw app/google-services.json
            else
              base64 -d /tmp/gs_raw > app/google-services.json
            fi
            rm -f /tmp/gs_raw
          fi
          if [ ! -f app/google-services.json ]; then
            echo "::error::Missing app/google-services.json. Commit app/google-services.json or add a repository secret named GOOGLE_SERVICES_JSON in GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Prepare debug signing keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
              printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            elif [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating fallback debug.keystore (note: Google Sign-In requires registering its SHA-1 or setting DEBUG_KEYSTORE_BASE64)."
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Prepare APK release file
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/sat-messenger-debug.apk

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sat-messenger-debug-apk
          path: dist/sat-messenger-debug.apk

      - name: Publish GitHub Release with Downloadable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('SAT Messenger {0}', github.ref_name) || 'SAT Messenger (Latest Build)' }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/sat-messenger-debug.apk
